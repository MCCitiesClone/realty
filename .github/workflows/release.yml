name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bump patch version
        id: version
        run: |
          FILE="buildSrc/src/main/kotlin/realty-conventions.gradle.kts"
          CURRENT=$(grep -oP 'version\s*=\s*"\K[^"]+' "$FILE" | head -n1)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not find a version in $FILE"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/version = \"${CURRENT}\"/version = \"${NEW}\"/" "$FILE"
          echo "Bumped ${CURRENT} -> ${NEW}"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x ./gradlew
          # realty-areashop-importer is excluded: its only dependency, the archived
          # md5sha256/AreaShop fork, is no longer resolvable through JitPack. It is a one-off
          # AreaShop -> Realty migration tool that is no longer shipped; build it locally with a
          # copy of the AreaShop jar if it is ever needed again.
          ./gradlew shadowJar -x :realty-areashop-importer:shadowJar

      - name: Collect JARs
        run: |
          mkdir -p jars
          # Only the two artifacts an operator installs. Everything else that lands in build/libs
          # is either already inside the plugin jar (chat-adapter, extracted to modules/ on first
          # enable), a library consumed as a Gradle dependency and already shaded in
          # (realty-backend, realty-backend-api, realty-paper-api), or build logic (buildSrc.jar).
          # realty-paper-plan-extension is built on demand per the README, not released.
          # A glob that matches nothing fails the step rather than publishing a short release.
          cp realty-paper/build/libs/realty-paper-*-all.jar jars/
          cp realty-paper-adapters/essentials-adapter/build/libs/essentials-adapter-*-all.jar jars/
          ls -l jars

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add buildSrc/src/main/kotlin/realty-conventions.gradle.kts
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" jars/*.jar \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
