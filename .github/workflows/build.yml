name: Build

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          # realty-areashop-importer is excluded: its only dependency, the archived
          # md5sha256/AreaShop fork, is no longer resolvable through JitPack. It is a one-off
          # AreaShop -> Realty migration tool that is no longer shipped; build it locally with a
          # copy of the AreaShop jar if it is ever needed again.
          ./gradlew shadowJar -x :realty-areashop-importer:shadowJar

      - name: Collect JARs
        run: |
          mkdir -p jars
          # Only the two artifacts an operator installs. Everything else that lands in build/libs
          # is either already inside the plugin jar (chat-adapter, extracted to modules/ on first
          # enable), a library consumed as a Gradle dependency and already shaded in
          # (realty-backend, realty-backend-api, realty-paper-api), or build logic (buildSrc.jar).
          # realty-paper-plan-extension is built on demand per the README, not released.
          # A glob that matches nothing fails the step rather than publishing a short release.
          cp realty-paper/build/libs/realty-paper-*-all.jar jars/
          cp realty-paper-adapters/essentials-adapter/build/libs/essentials-adapter-*-all.jar jars/

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: jars-${{ github.sha }}
          path: jars/*.jar
          if-no-files-found: error
          retention-days: 14
