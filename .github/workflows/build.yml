name: Build

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          # realty-areashop-importer is excluded: its only dependency, the archived
          # md5sha256/AreaShop fork, is no longer resolvable through JitPack. It is a one-off
          # AreaShop -> Realty migration tool that is no longer shipped; build it locally with a
          # copy of the AreaShop jar if it is ever needed again.
          ./gradlew shadowJar -x :realty-areashop-importer:shadowJar

      - name: Collect JARs
        run: |
          mkdir -p jars
          find . -path "*/build/libs/*.jar" -type f \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-tests.jar" \
            ! -name "*-plain.jar" \
            -exec cp {} jars/ \;

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: jars-${{ github.sha }}
          path: jars/*.jar
          if-no-files-found: error
          retention-days: 14
